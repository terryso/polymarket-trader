# GitHub Actions CI/CD Pipeline for Test Execution
# Generated by BMad TEA Agent - Test Architect Module
# Stack: fullstack | Framework: pytest (backend), vitest + playwright (frontend)
#
# Project Structure:
#   - Backend (Python): Root directory, pytest
#   - Frontend (React): dashboard/ directory, Vitest + Playwright

name: Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly burn-in on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "23"

jobs:
  # ============================================
  # BACKEND JOBS
  # ============================================

  # Backend Lint - Python code quality
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Black (code formatting)
        run: black --check src/ tests/

      - name: Run isort (import sorting)
        run: isort --check-only src/ tests/

      - name: Run mypy (type checking)
        run: mypy src/

  # Backend Test - Python unit tests
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run pytest with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============================================
  # FRONTEND JOBS
  # ============================================

  # Frontend Lint - React code quality
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: dashboard
        run: npm run lint

  # Frontend Unit Test - Vitest
  frontend-test:
    name: Frontend Test (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-lint

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run Vitest (shard ${{ matrix.shard }}/2)
        working-directory: dashboard
        run: npx vitest run --shard=${{ matrix.shard }}/2 --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./dashboard/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-${{ matrix.shard }}
          path: dashboard/test-results/
          retention-days: 30

  # Frontend E2E Test - Playwright
  frontend-e2e:
    name: Frontend E2E (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-lint

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/4)
        working-directory: dashboard
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: dashboard/playwright-report/
          retention-days: 30

  # ============================================
  # BURN-IN STAGE (Flaky Detection)
  # ============================================

  burn-in:
    name: Burn-In (Flaky Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [frontend-e2e]
    # Only run burn-in on PRs to main/develop or on schedule
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('dashboard/package-lock.json') }}

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      # Note: Burn-in targets UI flakiness for E2E tests
      - name: Run burn-in loop (5 iterations)
        working-directory: dashboard
        run: |
          echo "🔥 Starting burn-in loop - detecting flaky E2E tests"
          for i in {1..5}; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Burn-in iteration $i/5"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            npm run test:e2e || exit 1
          done
          echo "✅ Burn-in complete - no flaky tests detected"

      - name: Upload burn-in failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failures
          path: |
            dashboard/test-results/
            dashboard/playwright-report/
          retention-days: 30

  # ============================================
  # REPORT STAGE
  # ============================================

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-e2e, burn-in]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend (Python/pytest)" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint Status**: ${{ needs.backend-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Status**: ${{ needs.backend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend (React/Vitest/Playwright)" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint Status**: ${{ needs.frontend-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Test Status**: ${{ needs.frontend-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Test Status**: ${{ needs.frontend-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Burn-in Status**: ${{ needs.burn-in.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.burn-in.result }}" == "failure" ]; then
            echo "⚠️ **Flaky tests detected** - Review burn-in artifacts" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.backend-test.result }}" == "failure" ] || [ "${{ needs.frontend-test.result }}" == "failure" ] || [ "${{ needs.frontend-e2e.result }}" == "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Some tests failed** - Check the failed job logs for details" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # QUALITY GATE
  # ============================================

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-e2e]
    if: always()

    steps:
      - name: Check quality gate
        run: |
          echo "## Quality Gate Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Backend tests must pass
          if [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "❌ Backend tests failed - Quality gate FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Frontend unit tests must pass
          if [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "❌ Frontend unit tests failed - Quality gate FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Frontend E2E tests must pass
          if [ "${{ needs.frontend-e2e.result }}" != "success" ]; then
            echo "❌ Frontend E2E tests failed - Quality gate FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ All quality gates passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Unit Tests | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend E2E Tests | ✅ Pass |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # NOTIFICATIONS (Optional - configure secrets to enable)
  # ============================================

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-e2e, burn-in]
    if: failure()

    steps:
      - name: Send failure notification
        # Uncomment and configure SLACK_WEBHOOK_URL secret to enable Slack notifications
        # uses: slackapi/slack-github-action@v1.25.0
        # with:
        #   payload: |
        #     {
        #       "text": "🚨 CI Failed for ${{ github.repository }}",
        #       "blocks": [
        #         {
        #           "type": "section",
        #           "text": {
        #             "type": "mrkdwn",
        #             "text": "*🚨 CI Pipeline Failed*\n\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
        #           }
        #         }
        #       ]
        #     }
        # env:
        #   SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        #   SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        run: |
          echo "CI failed - notification would be sent here"
          echo "Configure SLACK_WEBHOOK_URL secret to enable Slack notifications"
