# GitHub Actions CI/CD Pipeline
# Simplified version - focuses on essential checks
#
# Stack: fullstack (Python backend + React frontend)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "23"

jobs:
  # ============================================
  # BACKEND JOBS
  # ============================================

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Black
        run: black --check src/ tests/

      - name: Run isort
        run: isort --check-only src/ tests/

      - name: Run mypy
        run: mypy src/
        continue-on-error: true

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run pytest
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============================================
  # FRONTEND JOBS
  # ============================================

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: dashboard
        run: npm run lint
        continue-on-error: true

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run Vitest
        working-directory: dashboard
        run: npm test

  # ============================================
  # QUALITY GATE
  # ============================================

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: always()

    steps:
      - name: Check quality gate
        run: |
          echo "## Quality Gate Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PASSED=true

          if [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "❌ Backend tests failed" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          else
            echo "✅ Backend tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "❌ Frontend tests failed" >> $GITHUB_STEP_SUMMARY
            PASSED=false
          else
            echo "✅ Frontend tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PASSED" = "false" ]; then
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 All quality gates passed!" >> $GITHUB_STEP_SUMMARY
