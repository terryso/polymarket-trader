[project]
name = "polymarket-trader"
version = "0.1.0"
description = "LLM-powered Polymarket trading system"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | dashboard
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv", "venv", "node_modules", "dashboard"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "venv",
    ".venv",
    "node_modules",
    "dashboard",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Add project root to Python path so `src` module can be imported
pythonpath = ["."]
# By default, skip integration tests. Use `pytest -m integration` to run only integration tests.
# Use `pytest -m "unit or not integration"` to run unit tests only.
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "unit: Unit tests (fast, mocked, no external calls)",
    "integration: Integration tests (slow, real API calls, requires network)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
